<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delete account - Trimzee</title>
<link rel="stylesheet" href="/css/site.css">
<style>
.dl-wrap{max-width:560px;margin:0 auto;padding:24px 16px 70px}
.dl-wrap h1{margin:14px 0 18px}
.dl-panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px}
.dl-panel p{margin:0 0 18px;line-height:1.55;color:var(--muted)}
.dl-form{margin:0 0 4px}
.dl-btn{display:block;width:100%;box-sizing:border-box;padding:14px 18px;border-radius:14px;font:inherit;font-weight:700;font-size:1rem;cursor:pointer;border:2px solid var(--ink);background:var(--paper);color:var(--ink)}
.dl-danger{border-color:#c0392b;color:#a4161a}
.dl-divider{border:0;border-top:1px solid var(--line);margin:22px 0}
.dl-label{display:block;font-weight:600;margin:0 0 8px}
.dl-input{display:block;width:100%;box-sizing:border-box;padding:14px;margin:0 0 16px;font:inherit;font-size:1.3rem;letter-spacing:.35em;text-align:center;border:1px solid var(--line);border-radius:12px;background:#fff}
.dl-notice{padding:12px 14px;border-radius:12px;margin:0 0 16px;font-weight:600}
.dl-notice.ok{background:#eef7ee;color:#1e5e20}
.dl-notice.bad{background:#fdecec;color:#a4161a}
</style>
</head>
<body>
{% include "_nav.html" %}
<main class="dl-wrap">
<a class="back" href="/account">&larr; Back to account</a>
<h1>Delete account</h1>
{% if notice %}<div class="dl-notice {{ 'bad' if error else 'ok' }}">{{ notice }}</div>{% endif %}
<section class="dl-panel">
<p>This permanently deletes your account. Your personal details are removed and you can't undo it. Booking and payment records are kept in anonymized form, as required for tax and accounting.</p>
<form method="post" action="/account/delete/request" class="dl-form">
<input type="hidden" name="csrf" value="{{ csrf_token() }}">
<button class="dl-btn" type="submit">Send me a delete code</button>
</form>
<hr class="dl-divider">
<form method="post" action="/account/delete/confirm" class="dl-form">
<input type="hidden" name="csrf" value="{{ csrf_token() }}">
<label class="dl-label" for="delete-code">6-digit code from your email</label>
<input id="delete-code" class="dl-input" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="000000" required>
<button class="dl-btn dl-danger" type="submit">Permanently delete my account</button>
</form>
</section>
</main>
</body>
</html>
