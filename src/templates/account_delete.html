<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delete account - Trimzee</title>
<link rel="stylesheet" href="/css/site.css">
</head>
<body>
{% include "_nav.html" %}
<main style="max-width:560px;margin:0 auto;padding:24px 16px 70px">
<a class="back" href="/account">&larr; Back to account</a>
<h1>Delete account</h1>
{% if notice %}<p class="{{ 'error' if error else 'muted' }}">{{ notice }}</p>{% endif %}
<section class="panel">
<p class="muted">This permanently deletes your account. Your personal details are removed and you can't undo it. Booking and payment records are kept in anonymized form, as required for tax and accounting.</p>
<form method="post" action="/account/delete/request">
<input type="hidden" name="csrf" value="{{ csrf_token() }}">
<button class="btn ghost" type="submit">Send me a delete code</button>
</form>
<form method="post" action="/account/delete/confirm" style="margin-top:16px">
<input type="hidden" name="csrf" value="{{ csrf_token() }}">
<label>6-digit code from your email
<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
</label>
<button class="btn danger" type="submit">Permanently delete my account</button>
</form>
</section>
</main>
</body>
</html>
