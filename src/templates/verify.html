<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify your email - Trimzee</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="stylesheet" href="/css/extra.css">
</head>
<body>
    {% include "_nav.html" %}
    <main class="auth-card">
        <h1>Check your email</h1>
        <p class="muted">We sent a 6-digit code to <strong>{{ email }}</strong>. It expires in 10 minutes.</p>
        {% if error %}<p class="message err">{{ error }}</p>{% endif %}
        {% if notice %}<p class="message ok">{{ notice }}</p>{% endif %}
        <form method="post" action="/verify">
            <input type="hidden" name="csrf" value="{{ csrf_token() }}">
            <label>Verification code
                <input class="otp" type="text" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="······" required autofocus>
            </label>
            <button class="book" type="submit">Verify and continue</button>
        </form>
        <form method="post" action="/verify/resend">
            <input type="hidden" name="csrf" value="{{ csrf_token() }}">
            <button class="btn ghost small" type="submit">Send a new code</button>
        </form>
        <p class="muted"><a href="/register">Use a different email</a></p>
    </main>
</body>
</html>
