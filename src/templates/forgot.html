<!doctype html>
<!-- Form that starts the password-reset process by email. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password - Trimzee</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;background:#f6f6f7;color:#111;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px}
.card{background:#fff;border-radius:14px;padding:28px;max-width:380px;width:100%;box-shadow:0 2px 14px rgba(0,0,0,.08)}
h1{font-size:1.3rem;margin:0 0 6px}
p{color:#555;font-size:.95rem;line-height:1.45}
label{display:block;font-size:.85rem;margin:14px 0 4px}
input{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #ccc;border-radius:9px;font-size:1rem}
button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:9px;background:#111;color:#fff;font-size:1rem;cursor:pointer}
.err{background:#fdecec;color:#a11;padding:10px 12px;border-radius:9px;margin:12px 0;font-size:.9rem}
a{color:#111}
</style>
</head>
<body>
<div class="card">
<h1>Forgot your password?</h1>
<p>Enter your account email. If it is registered, we will send you a 6-digit code.</p>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form method="post" action="/forgot">
<input type="hidden" name="csrf" value="{{ csrf_token() }}">
<label for="email">Email</label>
<input id="email" name="email" type="email" value="{{ email }}" autocomplete="email" required>
<button type="submit">Send code</button>
</form>
<p style="margin-top:16px"><a href="/login">Back to sign in</a></p>
</div>
</body>
</html>
