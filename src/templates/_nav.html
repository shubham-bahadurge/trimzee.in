<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/modern.css">
<link rel="stylesheet" href="/css/modern2.css">
<link rel="stylesheet" href="/css/modern3.css">
<header class="topbar">
    <div class="menu-wrap">
        <button class="icon-btn" type="button" id="menuBtn" aria-label="Menu" aria-expanded="false" aria-controls="menuPanel">☰</button>
        <nav class="pop left" id="menuPanel" hidden>
            <a href="/">Home</a>
            {% if current_user and current_user.role == 'owner' %}<a href="/dashboard">Dashboard</a>
            {% elif current_user and current_user.role == 'admin' %}<a href="/admin">Admin</a>
            {% else %}<a href="/my-bookings">My bookings</a>{% endif %}
            {% if current_user %}<a href="/account">My account</a>{% else %}<a href="/login">Sign in</a><a href="/register">Create account</a>{% endif %}
            <a href="{{ '/admin/billing' if current_user and current_user.role == 'admin' else '/plans' if current_user else '/login?next=/plans' }}">Subscription</a>
        </nav>
    </div>

    <a class="brand" href="/" aria-label="Trimzee home">
        <img src="/img/logo-mark.png" alt="" width="30" height="31">
        <span>TRIMZEE</span>
    </a>

    <div class="menu-wrap">
        <a class="icon-btn" href="{{ '/account' if current_user else '/login' }}" aria-label="{{ 'My account' if current_user else 'Sign in' }}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        </a>
    </div>
</header>
<script>
    (function () {
        var btn = document.getElementById("menuBtn"), panel = document.getElementById("menuPanel");
        function close() { panel.hidden = true; btn.setAttribute("aria-expanded", "false"); }
        btn.addEventListener("click", function (e) {
            e.stopPropagation();
            var open = panel.hidden;
            panel.hidden = !open;
            btn.setAttribute("aria-expanded", String(open));
        });
        panel.addEventListener("click", function (e) { e.stopPropagation(); });
        document.addEventListener("click", close);
        document.addEventListener("keydown", function (e) { if (e.key === "Escape") { close(); } });
    })();
</script>
{% if current_user %}<script>window.TZ_AUTH = true; window.TZ_ROLE = "{{ current_user.role }}";</script>
<script src="/js/notify.js"></script>{% endif %}
