<!DOCTYPE html>
<!-- Sign-in form for existing Trimzee accounts. -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - Trimzee</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    {% include "_nav.html" %}
    <main class="auth-card">
        <h1>Welcome back</h1>
        {% if next %}<p class="muted">Please sign in to continue.</p>{% endif %}
        {% if error %}<p class="message err">{{ error }}</p>{% endif %}
        <form method="post" action="/login">
            <input type="hidden" name="csrf" value="{{ csrf_token() }}">
            <input type="hidden" name="next" value="{{ next or '' }}">
            <label>Email<input type="email" name="email" value="{{ email }}" required autocomplete="email"></label>
            <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
            <button class="book" type="submit">Log in</button>
        </form>
<p style="text-align:center;margin-top:14px"><a href="/forgot">Forgot password?</a></p>
{% if google_enabled %}
<div style="text-align:center;color:#888;margin-top:14px;font-size:.85rem">or</div>
<a href="/auth/google{% if next %}?next={{ next|urlencode }}{% endif %}" style="display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;padding:12px;border:1px solid #dadce0;border-radius:12px;background:#fff;color:#3c4043;font-weight:600;text-decoration:none;font-size:.95rem"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg><span>Continue with Google</span></a>
{% endif %}

        <p class="muted">New here? <a href="/register{% if next %}?next={{ next|urlencode }}{% endif %}">Create an account</a></p>
    </main>
</body>
</html>
